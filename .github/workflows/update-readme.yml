name: Update README with GitHub Activity

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  build:
    name: Update README with recent activity
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Update README with GitHub activity
        uses: Readme-Workflows/recent-activity@v2.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit-message: "📊 Update README with recent GitHub activity"
          max-lines: 5
          committer-name: "GitHub Activity Bot"
          committer-email: "41898282+github-actions[bot]@users.noreply.github.com"
